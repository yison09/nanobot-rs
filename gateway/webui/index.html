<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>nanobot</title>
<style>
:root{--bg:#0e1116;--card:#161b22;--me:#2a5948;--bot:#1f2630;--txt:#e6edf3;--dim:#8b949e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,sans-serif}
#app{max-width:760px;margin:auto;display:flex;flex-direction:column;height:100vh}
header{padding:12px 16px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between}
header b{font-size:16px}header span{color:var(--dim);font-size:12px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--me)}.bot{align-self:flex-start;background:var(--bot)}
.err{align-self:center;color:#f85149;font-size:12px}
#bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #21262d}
input{flex:1;background:var(--card);border:1px solid #30363d;color:var(--txt);border-radius:8px;padding:10px 12px;font:inherit}
button{background:#238636;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer}
button:disabled{opacity:.5}
</style></head><body>
<div id="app">
<header><b>nanobot-rs</b><span id="st">connecting…</span></header>
<div id="log"></div>
<div id="bar"><input id="box" placeholder="Message… (Enter to send)" autofocus><button id="send">Send</button></div>
</div>
<script>
const log=document.getElementById('log'),box=document.getElementById('box'),send=document.getElementById('send'),st=document.getElementById('st');
const SID='web-'+Math.random().toString(36).slice(2,10);
function add(t,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function fire(){
  const text=box.value.trim();if(!text)return;
  box.value='';send.disabled=true;add(text,'me');
  const p=add('…','bot');
  try{
    if(!st.textContent.includes('online'))throw new Error('core offline');
    const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:text,session_id:SID})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();p.textContent=j.text||'(empty)';st.textContent='core online';
  }catch(e){p.className='msg err';p.textContent='ERR '+e.message}
  send.disabled=false;box.focus();
}
// fresh-review: fetch only rejects on network error — a 502 JSON body used to light
// up "core online" while the core was down; require HTTP ok + {"ok":true} now
// (note: r is scoped to the first then — do NOT reference it after r.json())
function probe(){fetch('/api/health').then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{if(!j.ok)throw 0;st.textContent='core online'}).catch(()=>st.textContent='core offline')}
probe();setInterval(probe,10000);
send.onclick=fire;box.onkeydown=e=>{if(e.key==='Enter')fire()};add('nanobot webui · session '+SID,'err');
</script></body></html>
